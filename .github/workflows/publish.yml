name: Publish

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

jobs:
  check-versions:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      publish-sheetorm: ${{ steps.versions.outputs.publish-sheetorm }}
      publish-query: ${{ steps.versions.outputs.publish-query }}
      publish-replica: ${{ steps.versions.outputs.publish-replica }}
      publish-rls: ${{ steps.versions.outputs.publish-rls }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check package versions
        id: versions
        run: |
          check_package() {
            local output="$1"
            local manifest="$2"
            local name
            local version

            name=$(node -p "require('./${manifest}').name")
            version=$(node -p "require('./${manifest}').version")

            echo "${name}@${version}"

            if npm view "${name}@${version}" version > /dev/null 2>&1; then
              echo "${output}=false" >> "$GITHUB_OUTPUT"
            else
              echo "${output}=true" >> "$GITHUB_OUTPUT"
            fi
          }

          check_package publish-query packages/query/package.json
          check_package publish-replica packages/replica/package.json
          check_package publish-sheetorm packages/sheetorm/package.json
          check_package publish-rls packages/rls/package.json

  publish:
    needs: check-versions
    if: ${{ needs.check-versions.outputs.publish-query == 'true' || needs.check-versions.outputs.publish-replica == 'true' || needs.check-versions.outputs.publish-sheetorm == 'true' || needs.check-versions.outputs.publish-rls == 'true' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # query は replica の workspace dependency。
      # 将来 sheetorm も query に依存する予定なので、
      # いずれかを publish する場合は先に query の dist を生成する。
      - name: Typecheck rls
        if: ${{ needs.check-versions.outputs.publish-rls == 'true' }}
        run: pnpm --filter @gasboost/rls typecheck

      - name: Test rls
        if: ${{ needs.check-versions.outputs.publish-rls == 'true' }}
        run: pnpm --filter @gasboost/rls test

      - name: Build rls
        if: ${{ needs.check-versions.outputs.publish-rls == 'true' || needs.check-versions.outputs.publish-sheetorm == 'true' }}
        run: pnpm --filter @gasboost/rls build

      - name: Verify rls package contents
        if: ${{ needs.check-versions.outputs.publish-rls == 'true' }}
        working-directory: packages/rls
        run: pnpm pack

      - name: Publish rls
        if: ${{ needs.check-versions.outputs.publish-rls == 'true' }}
        working-directory: packages/rls
        run: pnpm publish --access public --no-git-checks

      - name: Typecheck query
        if: ${{ needs.check-versions.outputs.publish-query == 'true' }}
        run: pnpm --filter @gasboost/query typecheck

      - name: Test query
        if: ${{ needs.check-versions.outputs.publish-query == 'true' }}
        run: pnpm --filter @gasboost/query test

      - name: Build query
        if: ${{ needs.check-versions.outputs.publish-query == 'true' || needs.check-versions.outputs.publish-replica == 'true' || needs.check-versions.outputs.publish-sheetorm == 'true' }}
        run: pnpm --filter @gasboost/query build

      - name: Typecheck replica
        if: ${{ needs.check-versions.outputs.publish-replica == 'true' }}
        run: pnpm --filter @gasboost/replica typecheck

      - name: Test replica
        if: ${{ needs.check-versions.outputs.publish-replica == 'true' }}
        run: pnpm --filter @gasboost/replica test

      - name: Build replica
        if: ${{ needs.check-versions.outputs.publish-replica == 'true' }}
        run: pnpm --filter @gasboost/replica build

      - name: Typecheck sheetorm
        if: ${{ needs.check-versions.outputs.publish-sheetorm == 'true' }}
        run: pnpm --filter @gasboost/sheetorm typecheck

      - name: Test sheetorm
        if: ${{ needs.check-versions.outputs.publish-sheetorm == 'true' }}
        run: pnpm --filter @gasboost/sheetorm test

      - name: Build sheetorm
        if: ${{ needs.check-versions.outputs.publish-sheetorm == 'true' }}
        run: pnpm --filter @gasboost/sheetorm build

      # 依存元から先に publish する。
      - name: Verify query package contents
        if: ${{ needs.check-versions.outputs.publish-query == 'true' }}
        working-directory: packages/query
        run: pnpm pack

      - name: Publish query
        if: ${{ needs.check-versions.outputs.publish-query == 'true' }}
        working-directory: packages/query
        run: pnpm publish --access public --no-git-checks

      - name: Verify replica package contents
        if: ${{ needs.check-versions.outputs.publish-replica == 'true' }}
        working-directory: packages/replica
        run: pnpm pack

      - name: Publish replica
        if: ${{ needs.check-versions.outputs.publish-replica == 'true' }}
        working-directory: packages/replica
        run: pnpm publish --access public --no-git-checks

      - name: Verify sheetorm package contents
        if: ${{ needs.check-versions.outputs.publish-sheetorm == 'true' }}
        working-directory: packages/sheetorm
        run: pnpm pack

      - name: Publish sheetorm
        if: ${{ needs.check-versions.outputs.publish-sheetorm == 'true' }}
        working-directory: packages/sheetorm
        run: pnpm publish --access public --no-git-checks
