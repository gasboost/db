name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck query
        run: pnpm --filter @gasboost/query typecheck

      - name: Test query
        run: pnpm --filter @gasboost/query test

      - name: Build query
        run: pnpm --filter @gasboost/query build

      - name: Pack query
        run: pnpm --filter @gasboost/query pack:check

      - name: Typecheck rls
        run: pnpm --filter @gasboost/rls typecheck

      - name: Test rls
        run: pnpm --filter @gasboost/rls test

      - name: Build rls
        run: pnpm --filter @gasboost/rls build

      - name: Pack rls
        run: pnpm --filter @gasboost/rls pack

      - name: Typecheck replica
        run: pnpm --filter @gasboost/replica typecheck

      - name: Test replica
        run: pnpm --filter @gasboost/replica test

      - name: Build replica
        run: pnpm --filter @gasboost/replica build

      - name: Pack replica
        run: pnpm --filter @gasboost/replica pack:check

      - name: Typecheck sheetorm
        run: pnpm --filter @gasboost/sheetorm typecheck

      - name: Test sheetorm
        run: pnpm --filter @gasboost/sheetorm test

      - name: Build sheetorm
        run: pnpm --filter @gasboost/sheetorm build

      - name: Pack and smoke test sheetorm
        run: |
          pnpm --filter @gasboost/query pack
          pnpm --filter @gasboost/sheetorm pack

          QUERY_PACKAGE_FILE="$(find "$(pwd)" -maxdepth 1 -name 'gasboost-query-*.tgz' -print -quit)"
          SHEETORM_PACKAGE_FILE="$(find "$(pwd)" -maxdepth 1 -name 'gasboost-sheetorm-*.tgz' -print -quit)"

          rm -rf /tmp/sheetorm-consumer
          mkdir -p /tmp/sheetorm-consumer
          cd /tmp/sheetorm-consumer

          pnpm init

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.pnpm = {
              overrides: {
                '@gasboost/query': 'file:${QUERY_PACKAGE_FILE}'
              }
            };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          pnpm add "$SHEETORM_PACKAGE_FILE"
          pnpm add -D typescript @types/google-apps-script

          cat > index.ts <<'EOF'
          import {
            SheetDB,
            SheetGateway,
            SheetTable,
          } from "@gasboost/sheetorm";

          console.log(
            typeof SheetDB,
            typeof SheetGateway,
            typeof SheetTable,
          );
          EOF

          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "strict": true,
              "types": ["google-apps-script"],
              "skipLibCheck": true
            },
            "include": ["index.ts"]
          }
          EOF

          pnpm exec tsc --noEmit
          pnpm exec tsc
          node index.js
