name: Publish

on:
  push:
    branches:
      - main
    paths:
      - "packages/sheetorm/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/publish.yml"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter @gasboost/sheetorm typecheck

      - name: Test
        run: pnpm --filter @gasboost/sheetorm test

      - name: Build
        run: pnpm --filter @gasboost/sheetorm build

      - name: Publish
        working-directory: packages/sheetorm
        run: npm publish --access public
