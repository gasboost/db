name: Verify feature 5

on:
  push:
    branches:
      - feature/5-crud

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gasboost/sheetorm typecheck
      - run: pnpm --filter @gasboost/sheetorm test
